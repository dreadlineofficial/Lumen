plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.dreadlineofficial.lumen'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.dreadlineofficial.lumen'
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName "1.0." + (project.findProperty('versionCode') ?: '1')
        // the website the app opens; change this if Lumen moves
        buildConfigField 'String', 'LUMEN_URL', '"https://dreadlineofficial.github.io/Lumen/"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
