<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lumi's Leap</title>
<style>
  html,body{margin:0;height:100%;background:#07081a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block}
  .tc{position:fixed;bottom:18px;display:none;gap:14px;z-index:2}
  .tc button{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:700 26px sans-serif;backdrop-filter:blur(4px)}

  #tcL{left:18px}#tcR{right:18px}
  body.touch .tc{display:flex}

<body>
<canvas id="c"></canvas>
<div class="tc" id="tcL"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="tc" id="tcR"><button data-k="pause" style="width:54px;height:54px;font-size:18px;align-self:flex-end">II</button><button data-k="jump">⤒</button></div>
<script>
'use strict';
/* =====================================================================
   LUMI'S LEAP: a small platformer made for Lumen.
   Guide Lumi, a little spirit of light, through six worlds.
   Arrows / WASD to move, Space / Z / W / Up to jump, Esc or P to pause.
   ===================================================================== */
const VW=960,VH=540,T=32;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let SC=1,DPR=1;
function fit(){SC=Math.min(innerWidth/VW,innerHeight/VH);DPR=Math.min(2,(devicePixelRatio||1));cv.style.width=Math.floor(VW*SC)+'px';cv.style.height=Math.floor(VH*SC)+'px';cv.width=Math.round(VW*SC*DPR);cv.height=Math.round(VH*SC*DPR)}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------------- save ---------------- */
const SAVE_KEY='lumisleap.v1';
let save={unlocked:1,feather:false,best:{},gems:{},orbs:{},music:true,sfx:true};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}};

/* ---------------- input ---------------- */
const keys={},pressed={};
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyK:'jump',ArrowDown:'down',KeyS:'down',Escape:'pause',KeyP:'pause',Enter:'ok',KeyM:'music'};
addEventListener('keydown',e=>{const k=KMAP[e.code];if(!k)return;e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true;audio.unlock()});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k){keys[k]=false}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')state='pause'});
// touch
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
document.querySelectorAll('.tc button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();audio.unlock();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)});
// mouse on menus
let mouse={x:-1,y:-1,click:false};
const toView=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}};
cv.addEventListener('mousemove',e=>{const p=toView(e);mouse.x=p.x;mouse.y=p.y});
cv.addEventListener('mousedown',e=>{const p=toView(e);mouse.x=p.x;mouse.y=p.y;mouse.click=true;audio.unlock()});
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];const p=toView(t);mouse.x=p.x;mouse.y=p.y;mouse.click=true;audio.unlock()},{passive:true});
// gamepad
function pollPad(){const gp=navigator.getGamepads?.()[0];if(!gp)return;const ax=gp.axes[0]||0,b=i=>gp.buttons[i]?.pressed;
  const set=(k,v)=>{if(v&&!keys['pad_'+k])pressed[k]=true;keys['pad_'+k]=v};
  set('left',ax<-.4||b(14));set('right',ax>.4||b(15));set('jump',b(0)||b(1));set('pause',b(9));set('ok',b(0))}
const held=k=>keys[k]||keys['pad_'+k];

/* ---------------- audio (all synthesized) ---------------- */
const audio={ctx:null,master:null,musicGain:null,unlock(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=.5;this.master.connect(this.ctx.destination);
      this.musicGain=this.ctx.createGain();this.musicGain.gain.value=save.music?.22:0;this.musicGain.connect(this.master);music.start()}catch(e){}},
  tone(f,d,type='square',vol=.2,slide=0,delay=0){if(!this.ctx||!save.sfx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.02)},
  noise(d,vol=.2,hp=800){if(!this.ctx||!save.sfx)return;const n=this.ctx.createBuffer(1,this.ctx.sampleRate*d,this.ctx.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
    const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();f.type='highpass';f.frequency.value=hp;g.gain.value=vol;s.buffer=n;s.connect(f);f.connect(g);g.connect(this.master);s.start()}};
const sfx={jump:()=>audio.tone(420,.14,'square',.12,380),djump:()=>{audio.tone(620,.12,'triangle',.14,500);audio.tone(930,.1,'sine',.08,300,.04)},orb:()=>{audio.tone(990,.08,'sine',.12);audio.tone(1480,.12,'sine',.1,0,.05)},
  gem:()=>[880,1108,1318,1760].forEach((f,i)=>audio.tone(f,.18,'triangle',.13,0,i*.07)),stomp:()=>{audio.tone(240,.12,'square',.16,-160);audio.noise(.08,.1,1200)},die:()=>{audio.tone(330,.5,'sawtooth',.15,-280);audio.noise(.25,.12,400)},
  spring:()=>audio.tone(300,.25,'sine',.18,700),check:()=>[660,880,1320].forEach((f,i)=>audio.tone(f,.14,'triangle',.12,0,i*.06)),win:()=>[523,659,784,1046,1318].forEach((f,i)=>audio.tone(f,.26,'triangle',.14,0,i*.09)),
  feather:()=>[700,900,1200,1600,2000].forEach((f,i)=>audio.tone(f,.2,'sine',.12,0,i*.06)),crumble:()=>audio.noise(.2,.1,600),land:()=>audio.noise(.05,.05,2000),select:()=>audio.tone(760,.06,'square',.08)};
// a gentle looping tune: soft arpeggios over a slow bass line
const music={timer:null,step:0,start(){if(this.timer)return;const sch=()=>{if(!audio.ctx)return;const t=audio.ctx.currentTime;
      const prog=[[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,64]],ch=prog[Math.floor(this.step/16)%4],n=ch[this.step%4]+(this.step%8>=4?12:0);
      const play=(m,d,type,vol)=>{const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.musicGain);o.start(t);o.stop(t+d+.05)};
      play(n+12,.35,'triangle',.18);if(this.step%8===0)play(ch[0]-12,1.6,'sine',.3);if(this.step%16===12)play(ch[2]+24,.6,'sine',.06);this.step++};this.timer=setInterval(sch,190)},
  set(on){save.music=on;store();if(audio.musicGain)audio.musicGain.gain.value=on?.22:0}};

/* ---------------- levels (built from small pieces so every jump is fair) ---------------- */
// tiles: 1 ground, 2 one-way, 3 spikes, 4 crumble. Things: orbs, gems, enemies, springs, checkpoints, movers, feather, goal
function makeLevel(def){const w=def.w,h=def.h||18,g=Array.from({length:h},()=>new Uint8Array(w)),L={name:def.name,theme:def.theme,w,h,g,orbs:[],gems:[],foes:[],springs:[],checks:[],movers:[],crumbles:[],feather:null,goal:null,start:{x:2,y:14},dark:!!def.dark,hint:def.hint||''};
  const api={
    G:(x0,x1,top=15)=>{for(let x=x0;x<=x1;x++)for(let y=top;y<h;y++)g[y][x]=1},
    B:(x0,x1,y0,y1)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)g[y][x]=1},
    plat:(x0,x1,y)=>{for(let x=x0;x<=x1;x++)g[y][x]=2},
    spikes:(x0,x1,y)=>{for(let x=x0;x<=x1;x++)g[y][x]=3},
    crumble:(x0,x1,y)=>{for(let x=x0;x<=x1;x++){g[y][x]=4;L.crumbles.push({x,y,t:0,state:0})}},
    P:(x,y)=>{L.start={x,y}},
    O:(x0,x1,y)=>{for(let x=x0;x<=x1;x++)L.orbs.push({x:x*T+T/2,y:y*T+T/2,got:false,ph:Math.random()*6})},
    arc:(x0,y,n,hgt=2)=>{for(let i=0;i<n;i++){const t=n>1?i/(n-1):.5;L.orbs.push({x:(x0+i)*T+T/2,y:(y-Math.sin(t*Math.PI)*hgt)*T+T/2,got:false,ph:Math.random()*6})}},
    gem:(x,y)=>L.gems.push({x:x*T+T/2,y:y*T+T/2,got:false}),
    walker:(x,y,dir=-1)=>L.foes.push({kind:'walk',x:x*T+4,y:(y+1)*T-22,w:24,h:22,vx:55*dir,vy:0,alive:true,t:Math.random()*5,sx:x*T+4,sy:(y+1)*T-22,sdir:dir}),
    flyer:(x,y,rx=3,ry=0)=>L.foes.push({kind:'fly',x:x*T+5,y:y*T+5,w:22,h:20,cx0:x*T+5,cy0:y*T+5,rx:rx*T,ry:ry*T,alive:true,t:Math.random()*6,sp:1+Math.random()*.3}),
    spring:(x,y)=>L.springs.push({x:x*T+4,y:(y+1)*T-12,w:24,h:12,t:0}),
    check:(x,y)=>L.checks.push({x:x*T+T/2,y:(y+1)*T,on:false}),
    mover:(x,y,len,dx,dy,speed=1)=>L.movers.push({x0:x*T,y0:y*T,x:x*T,y:y*T,w:len*T,h:12,dx:dx*T,dy:dy*T,t:0,sp:speed,vx:0,vy:0}),
    feather:(x,y)=>{L.feather={x:x*T+T/2,y:y*T+T/2,got:false}},
    goal:(x,y)=>{L.goal={x:x*T+T/2,y:(y+1)*T}}};
  def.build(api);return L}

const THEMES={
  meadow:{sky:['#4aa3ff','#aee3ff'],far:'#7cc3a2',mid:'#4f9d77',ground:'#5b3b25',top:'#59d36b',edge:'#3fae52',plat:'#c8915a',deco:'flowers',stars:false,sun:'#fff3b0'},
  forest:{sky:['#1f4a5c','#8cc7a8'],far:'#2b6b56',mid:'#1d4f3f',ground:'#3f2a1d',top:'#3fbf66',edge:'#2c8f4b',plat:'#a87547',deco:'pines',stars:false,sun:'#f6ffd9'},

/* ---------------- game state ---------------- */
let state='title',level=null,li=0,P=null,cam={x:0,y:0},parts=[],shake=0,time=0,deaths=0,levelTime=0,menuSel=0,banner=0,flash=0,fade=0,fadeTo=null,winInfo=null,titleT=0;
const GRAV=2050,MAXFALL=900,ACC=2600,AIRACC=1900,FRIC=2300,MAXV=265,JUMPV=650,DJUMPV=600,COYOTE=.1,BUFFER=.13,WALLSLIDE=120;
function newPlayer(x,y){return{x:x*T+6,y:y*T+T-26,w:20,h:26,vx:0,vy:0,ground:false,coyote:0,buffer:0,jumpsLeft:0,face:1,sq:1,blink:3,wall:0,onMover:null,dead:0,inv:0,trail:[]}}
function loadLevel(i){li=i;level=makeLevel(LEVELS[i]);const s=level.checkpoint||level.start;P=newPlayer(level.start.x,level.start.y);levelTime=0;deaths=0;parts=[];banner=2.6;
  cam.x=clamp(P.x-VW/2,0,level.w*T-VW);cam.y=clamp(P.y-VH*.55,0,level.h*T-VH);state='play';if(level.feather&&save.feather)level.feather.got=true}
const tileAt=(tx,ty)=>{if(tx<0||tx>=level.w)return 1;if(ty<0)return 0;if(ty>=level.h)return 0;return level.g[ty][tx]};
const solid=t=>t===1||t===4;
function crumbleAt(tx,ty){return level.crumbles.find(c=>c.x===tx&&c.y===ty)}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,n,col,sp=180,life=.6,size=3){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life,max:life,col,size:rnd(size*.6,size*1.3),g:500})}}

function kill(){if(P.dead||P.inv>0)return;P.dead=1;deaths++;sfx.die();shake=.35;burst(P.x+P.w/2,P.y+P.h/2,40,'#fff6b8',260,.8,4)}
function respawn(){const c=[...level.checks].reverse().find(c=>c.on);const nx=c?Math.floor(c.x/T):level.start.x,ny=c?Math.floor(c.y/T)-1:level.start.y;
  const p=newPlayer(nx,ny);p.inv=1;P=p;for(const f of level.foes){if(f.kind==='walk'&&!f.alive&&false)f.alive=true}
  for(const c of level.crumbles){c.state=0;c.t=0;level.g[c.y][c.x]=4}}

/* ---------------- update ---------------- */
function update(dt){time+=dt;titleT+=dt;pollPad();
  if(fade>0){fade-=dt;if(fade<=0&&fadeTo){const f=fadeTo;fadeTo=null;f();fade=-.35}}
  if(fade<0){fade=Math.min(0,fade+dt)}
  if(state==='poster')return;
  if(state==='title'||state==='select'||state==='pause'||state==='win'||state==='end'){menuUpdate(dt);for(const k in pressed)delete pressed[k];mouse.click=false;return}

function stepMovers(dt){for(const m of level.movers){m.t+=dt*m.sp;const k=(1-Math.cos(m.t*1.2))/2,nx=m.x0+m.dx*k,ny=m.y0+m.dy*k;m.vx=(nx-m.x)/dt;m.vy=(ny-m.y)/dt;m.x=nx;m.y=ny}}

function stepPlayer(dt){const p=P;

    if(p.coyote>0){p.vy=-JUMPV;p.coyote=0;p.buffer=0;p.ground=false;p.sq=.6;sfx.jump();burst(p.x+p.w/2,p.y+p.h,8,'#ffffffaa',90,.35,2.5)}

function moveX(p,dx){p.x+=dx;const y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-1)/T);

  else if(dx<0){const tx=Math.floor(p.x/T);for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(tx,ty))){p.x=(tx+1)*T;p.vx=0;break}}}
function moveY(p,dy){const oldBottom=p.y+p.h;p.y+=dy;p.ground=false;p.onMover=null;const x0=Math.floor((p.x+1)/T),x1=Math.floor((p.x+p.w-1)/T);

  if(p.vy>=0)for(const m of level.movers){if(p.x+p.w>m.x+2&&p.x<m.x+m.w-2&&oldBottom<=m.y+6+Math.max(0,m.vy*.02)&&p.y+p.h>=m.y-1&&p.y+p.h<=m.y+14){p.y=m.y-p.h;p.vy=0;p.ground=true;p.onMover=m}}}

function stepFoes(dt){for(const f of level.foes){if(!f.alive){f.t+=dt;continue}f.t+=dt;
    if(f.kind==='walk'){f.vy=Math.min(MAXFALL,f.vy+GRAV*dt);const nx=f.x+f.vx*dt,ahead=f.vx>0?nx+f.w:nx,below=Math.floor((f.y+f.h+2)/T),col=Math.floor(ahead/T);
      const wallHit=solid(tileAt(col,Math.floor((f.y+f.h-4)/T))),ledge=!solid(tileAt(col,below))&&tileAt(col,below)!==2;
      if(wallHit||ledge)f.vx*=-1;else f.x=nx;f.y+=f.vy*dt;const ty=Math.floor((f.y+f.h)/T);if(solid(tileAt(Math.floor((f.x+f.w/2)/T),ty))||tileAt(Math.floor((f.x+f.w/2)/T),ty)===2){f.y=ty*T-f.h;f.vy=0}}
    else{f.x=f.cx0+Math.sin(f.t*f.sp)*f.rx;f.y=f.cy0+Math.sin(f.t*f.sp*2)*f.ry+Math.sin(f.t*3)*4}

function stepThings(dt){const p=P,pr={x:p.x,y:p.y,w:p.w,h:p.h};if(p.dead)return;

  for(const gm of level.gems){if(!gm.got&&Math.abs(gm.x-(p.x+p.w/2))<22&&Math.abs(gm.y-(p.y+p.h/2))<24){gm.got=true;sfx.gem();flash=.25;burst(gm.x,gm.y,24,'#9df0ff',220,.7,3.5)}}

function finishLevel(){sfx.win();const orbs=level.orbs.filter(o=>o.got).length,gems=level.gems.map(g=>g.got);

let buttons=[];
function menuUpdate(dt){for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.life>0);
  const n=buttons.length;if(!n)return;
  if(pressed.down||pressed.right&&state==='select'){menuSel=(menuSel+1)%n;sfx.select()}
  if(pressed.jump&&state!=='select'&&false){}
  if(KUP()){menuSel=(menuSel-1+n)%n;sfx.select()}
  for(let i=0;i<n;i++){const b=buttons[i];if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){if(menuSel!==i&&mouse.click===false&&b.hover!==true){}menuSel=i;if(mouse.click){b.act();sfx.select();return}}}
  if(pressed.ok||(pressed.jump&&!keys.ArrowUpOnly)){buttons[menuSel]?.act();sfx.select()}

const KUP=()=>pressed.up;

addEventListener('keydown',e=>{if(e.code==='ArrowUp'||e.code==='KeyW'){pressed.up=true;if(state!=='play')delete pressed.jump}if(e.code==='ArrowLeft'&&state==='select'){pressed.up=true}});

function draw(){cx.setTransform(SC*DPR,0,0,SC*DPR,0,0);cx.imageSmoothingEnabled=true;

  else{drawWorld();drawHUD();if(state==='pause')drawPause();if(state==='win'||state==='end')drawWin()}
  if(fade){cx.fillStyle=`rgba(7,8,26,${fade>0?1-fade/.35:-fade/.35})`;cx.fillRect(0,0,VW,VH)}}

function sky(th,ox=0){const gr=cx.createLinearGradient(0,0,0,VH);gr.addColorStop(0,th.sky[0]);gr.addColorStop(1,th.sky[1]);cx.fillStyle=gr;cx.fillRect(0,0,VW,VH);
  if(th.stars){for(let i=0;i<90;i++){const x=(i*137.5-ox*.05)%VW,y=(i*61.7)%(VH*.6),tw=.4+.6*Math.abs(Math.sin(time*1.3+i));cx.fillStyle=`rgba(255,255,255,${.5*tw})`;cx.fillRect((x+VW)%VW,y,2,2)}}
  if(th.sun){const sx=VW*.78-ox*.03,sy=VH*.2;const g=cx.createRadialGradient(sx,sy,10,sx,sy,140);g.addColorStop(0,th.sun);g.addColorStop(.25,th.sun+'aa');g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(sx-150,sy-150,300,300)}}

function drawBack(th){sky(th,cam.x);
  hills(th.far,cam.x*.2,VH*.62-cam.y*.05,60,.006,1);
  if(th.deco==='clouds'){for(let i=0;i<9;i++){const x=((i*260-cam.x*.35)%(VW+300)+VW+300)%(VW+300)-150,y=120+((i*97)%220)-cam.y*.1;cloud(x,y,1+(i%3)*.3,'rgba(255,255,255,.55)')}}

  if(th.deco==='pines'){cx.fillStyle='#163d31';for(let i=0;i<30;i++){const x=((i*83-cam.x*.6)%(VW+120)+VW+120)%(VW+120)-60,b=VH*.86-cam.y*.15,h=70+(i*37)%60;cx.beginPath();cx.moveTo(x,b-h);cx.lineTo(x+22,b);cx.lineTo(x-22,b);cx.fill()}}
  if(th.deco==='crystals'){for(let i=0;i<22;i++){const x=((i*131-cam.x*.5)%(VW+100)+VW+100)%(VW+100)-50,b=VH*.9-cam.y*.15,h=30+(i*29)%50;cx.fillStyle=`hsla(${250+(i*23)%70},90%,65%,.35)`;cx.beginPath();cx.moveTo(x,b-h);cx.lineTo(x+10,b);cx.lineTo(x-10,b);cx.fill()}}

    if(th.deco==='snow'){cx.fillStyle='rgba(255,255,255,.7)';cx.beginPath();cx.arc(x,y,1.5+(i%3),0,7);cx.fill()}else{cx.fillStyle='rgba(255,190,110,.5)';cx.fillRect(x,y,5,7)}}}}
function cloud(x,y,s,col){cx.fillStyle=col;cx.beginPath();for(const [dx,dy,r] of [[0,0,26],[24,-10,30],[52,0,24],[26,8,26]])cx.arc(x+dx*s,y+dy*s,r*s,0,7);cx.fill()}

function drawWorld(){const th=THEMES[level.theme];drawBack(th);
  const sx=shake>0?rnd(-1,1)*shake*18:0,sy=shake>0?rnd(-1,1)*shake*18:0;cx.save();cx.translate(Math.round(-cam.x+sx),Math.round(-cam.y+sy));

        if(th.deco==='snow'){cx.fillStyle='#fff';cx.fillRect(px,py,T,4)}}

    else if(t===2){cx.fillStyle=th.plat;cx.fillRect(px,py,T,9);cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(px,py+9,T,3);cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(px,py,T,2)}
    else if(t===3){cx.fillStyle='#e8ecf5';for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(px+i*8,py+T);cx.lineTo(px+i*8+4,py+12);cx.lineTo(px+i*8+8,py+T);cx.fill()}cx.fillStyle='rgba(0,0,0,.2)';cx.fillRect(px,py+T-3,T,3)}
    else if(t===4){const c=crumbleAt(x,y),jit=c&&c.state===1?rnd(-1.5,1.5):0;cx.fillStyle='#8a6f9e';cx.fillRect(px+jit,py,T,T);cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=2;cx.beginPath();cx.moveTo(px+jit+4,py+6);cx.lineTo(px+jit+14,py+16);cx.lineTo(px+jit+10,py+28);cx.moveTo(px+jit+22,py+4);cx.lineTo(px+jit+18,py+18);cx.stroke();cx.fillStyle='rgba(255,255,255,.2)';cx.fillRect(px+jit,py,T,4)}}

  // checkpoints

  for(const o of level.orbs){if(o.got)continue;const y=o.y+Math.sin(time*3+o.ph)*3;glow(o.x,y,16,'rgba(255,220,110,.45)');cx.fillStyle='#ffe68a';cx.beginPath();cx.arc(o.x,y,6,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(o.x-2,y-2,2,0,7);cx.fill()}
  for(const g of level.gems){if(g.got)continue;const y=g.y+Math.sin(time*2.4)*4;glow(g.x,y,28,'rgba(120,230,255,.45)');cx.save();cx.translate(g.x,y);cx.rotate(Math.sin(time*2)*.15);cx.fillStyle='#7ee8ff';cx.beginPath();cx.moveTo(0,-13);cx.lineTo(11,-3);cx.lineTo(0,13);cx.lineTo(-11,-3);cx.closePath();cx.fill();cx.fillStyle='#e8fbff';cx.beginPath();cx.moveTo(0,-13);cx.lineTo(5,-3);cx.lineTo(0,4);cx.lineTo(-5,-3);cx.closePath();cx.fill();cx.restore()}
  const fe=level.feather;if(fe&&!fe.got){const y=fe.y+Math.sin(time*2)*6;glow(fe.x,y,40,'rgba(190,232,255,.5)');cx.save();cx.translate(fe.x,y);cx.rotate(-.5+Math.sin(time*1.5)*.15);cx.fillStyle='#e9f6ff';cx.beginPath();cx.ellipse(0,0,7,18,0,0,7);cx.fill();cx.strokeStyle='#9bc7e8';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,-16);cx.lineTo(0,20);cx.stroke();cx.restore()}
  // goal portal
  const g=level.goal;if(g){for(let i=0;i<3;i++){cx.strokeStyle=`hsla(${(time*80+i*40)%360},90%,75%,${.7-i*.2})`;cx.lineWidth=4;cx.beginPath();cx.ellipse(g.x,g.y-36,22+i*5+Math.sin(time*3+i)*2,34+i*5,0,0,7);cx.stroke()}glow(g.x,g.y-36,70,'rgba(200,170,255,.35)');
    for(let i=0;i<3;i++){const a=time*2+i*2.1;cx.fillStyle='#fff';cx.beginPath();cx.arc(g.x+Math.cos(a)*16,g.y-36+Math.sin(a)*26,2,0,7);cx.fill()}}
  // enemies
  for(const f of level.foes){if(!f.alive){if(f.t<.4){cx.globalAlpha=1-f.t/.4;cx.fillStyle=f.kind==='fly'?'#ff8fd8':'#ff9a4d';cx.fillRect(f.x,f.y+f.h-6,f.w,6);cx.globalAlpha=1}continue}
    if(f.kind==='walk'){const b=Math.abs(Math.sin(f.t*10))*2;cx.fillStyle='#ff9a4d';rr(f.x,f.y-b,f.w,f.h,8);cx.fill();cx.fillStyle='#d9662a';cx.fillRect(f.x+3,f.y+f.h-5-b,f.w-6,4);
      const ex=f.vx>0?4:-4;cx.fillStyle='#fff';cx.beginPath();cx.arc(f.x+8+ex,f.y+8-b,4,0,7);cx.arc(f.x+17+ex,f.y+8-b,4,0,7);cx.fill();cx.fillStyle='#1b1030';cx.beginPath();cx.arc(f.x+9+ex,f.y+9-b,2,0,7);cx.arc(f.x+18+ex,f.y+9-b,2,0,7);cx.fill();
      cx.fillStyle='#d9662a';cx.beginPath();cx.moveTo(f.x+4,f.y-b);cx.lineTo(f.x+8,f.y-7-b);cx.lineTo(f.x+12,f.y-b);cx.moveTo(f.x+13,f.y-b);cx.lineTo(f.x+17,f.y-7-b);cx.lineTo(f.x+21,f.y-b);cx.fill()}
    else{const w=Math.sin(f.t*18)*6;cx.fillStyle='rgba(255,180,240,.7)';cx.beginPath();cx.ellipse(f.x+3,f.y+6,9,4+w*.4,-.5,0,7);cx.ellipse(f.x+f.w-3,f.y+6,9,4+w*.4,.5,0,7);cx.fill();
      cx.fillStyle='#d34fb0';cx.beginPath();cx.arc(f.x+f.w/2,f.y+f.h/2+2,10,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(f.x+f.w/2+2,f.y+f.h/2,4,0,7);cx.fill();cx.fillStyle='#1b1030';cx.beginPath();cx.arc(f.x+f.w/2+3,f.y+f.h/2+1,2,0,7);cx.fill()}}
  drawPlayer();
  for(const p of parts){cx.globalAlpha=Math.max(0,p.life/p.max);cx.fillStyle=p.col;cx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}cx.globalAlpha=1;
  cx.restore();
  // caves are dark: only Lumi's own light shows the way
  if(level.dark)darkness();
  if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash*.6})`;cx.fillRect(0,0,VW,VH)}}
const dk=document.createElement('canvas');dk.width=VW;dk.height=VH;const dkx=dk.getContext('2d');
function darkness(){dkx.globalCompositeOperation='source-over';dkx.clearRect(0,0,VW,VH);dkx.fillStyle='rgba(4,3,12,.93)';dkx.fillRect(0,0,VW,VH);dkx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a=1)=>{const g=dkx.createRadialGradient(x,y,r*.2,x,y,r);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');dkx.fillStyle=g;dkx.beginPath();dkx.arc(x,y,r,0,7);dkx.fill()};
  hole(P.x+P.w/2-cam.x,P.y+P.h/2-cam.y,210+Math.sin(time*3)*6);
  for(const o of level.orbs)if(!o.got)hole(o.x-cam.x,o.y-cam.y,46,.7);for(const g of level.gems)if(!g.got)hole(g.x-cam.x,g.y-cam.y,60,.8);
  for(const c of level.checks)hole(c.x-cam.x,c.y-40-cam.y,c.on?110:50,.8);if(level.goal)hole(level.goal.x-cam.x,level.goal.y-36-cam.y,120,.9);
  cx.drawImage(dk,0,0,VW,VH)}
function glow(x,y,r,col){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(x-r,y-r,r*2,r*2)}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

function drawLumi(x,y,face,sq,blink,scale=1,alpha=1){cx.save();cx.translate(x,y);cx.scale(scale,scale);cx.globalAlpha=alpha;
  glow(0,-13,46,'rgba(255,236,150,.4)');
  const w=1/Math.sqrt(sq),h=sq;cx.save();cx.scale(w,h);
  // little scarf
  cx.fillStyle='#ff6b8a';cx.beginPath();cx.moveTo(-6*face,-8);cx.quadraticCurveTo(-18*face,-6+Math.sin(time*12)*3,-24*face,-10+Math.sin(time*9)*4);cx.lineTo(-20*face,-4);cx.quadraticCurveTo(-12*face,-2,-4*face,-3);cx.fill();
  const g=cx.createRadialGradient(-4,-18,2,0,-13,16);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#fff3b0');g.addColorStop(1,'#ffc94d');cx.fillStyle=g;cx.beginPath();cx.ellipse(0,-13,12,13,0,0,7);cx.fill();
  // flame tuft
  cx.fillStyle='#fff3b0';cx.beginPath();cx.moveTo(-5,-24);cx.quadraticCurveTo(-2,-34+Math.sin(time*8)*2,3,-31);cx.quadraticCurveTo(2,-27,5,-24);cx.fill();
  const ex=face*3;if(blink>.12){cx.fillStyle='#2a1a3a';cx.beginPath();cx.ellipse(-4+ex,-14,2.2,3.2,0,0,7);cx.ellipse(4+ex,-14,2.2,3.2,0,0,7);cx.fill();cx.fillStyle='#fff';cx.fillRect(-4.5+ex,-16,1.2,1.2);cx.fillRect(3.5+ex,-16,1.2,1.2)}
  else{cx.strokeStyle='#2a1a3a';cx.lineWidth=1.6;cx.beginPath();cx.moveTo(-6+ex,-14);cx.lineTo(-2+ex,-14);cx.moveTo(2+ex,-14);cx.lineTo(6+ex,-14);cx.stroke()}
  cx.fillStyle='rgba(255,120,140,.45)';cx.beginPath();cx.ellipse(-7+ex,-9,2.5,1.6,0,0,7);cx.ellipse(7+ex,-9,2.5,1.6,0,0,7);cx.fill();
  cx.restore();cx.restore()}
function drawPlayer(){const p=P;if(p.dead)return;if(p.inv>0&&Math.floor(time*20)%2)return;
  for(let i=0;i<p.trail.length;i++){const t=p.trail[i];cx.fillStyle=`rgba(255,230,140,${i/p.trail.length*.25})`;cx.beginPath();cx.arc(t.x,t.y,3+i*.5,0,7);cx.fill()}
  drawLumi(p.x+p.w/2,p.y+p.h,p.face,p.sq,p.blink)}

function txt(s,x,y,size,col='#fff',align='center',weight=800){cx.font=`${weight} ${size}px "Trebuchet MS",system-ui,sans-serif`;cx.textAlign=align;cx.textBaseline='middle';cx.fillStyle='rgba(0,0,0,.35)';cx.fillText(s,x+2,y+3);cx.fillStyle=col;cx.fillText(s,x,y)}
const fmtT=t=>{const m=Math.floor(t/60),s=t%60;return`${m}:${s<10?'0':''}${s.toFixed(2)}`};
function drawHUD(){const got=level.orbs.filter(o=>o.got).length;
  cx.fillStyle='rgba(10,10,30,.45)';rr(14,12,250,40,20);cx.fill();
  cx.fillStyle='#ffe68a';cx.beginPath();cx.arc(36,32,7,0,7);cx.fill();txt(`${got}/${level.orbs.length}`,52,32,18,'#fff','left',700);
  level.gems.forEach((g,i)=>{const x=130+i*26;cx.fillStyle=g.got?'#7ee8ff':'rgba(255,255,255,.2)';cx.beginPath();cx.moveTo(x,20);cx.lineTo(x+9,30);cx.lineTo(x,44);cx.lineTo(x-9,30);cx.closePath();cx.fill()});
  txt(fmtT(levelTime),VW-24,32,18,'#fff','right',700);txt(`${li+1}. ${level.name}`,VW/2,30,16,'rgba(255,255,255,.85)','center',700);
  if(banner>0){const a=Math.min(1,banner,2.6-banner+.3);cx.globalAlpha=Math.max(0,a);txt(level.name,VW/2,VH*.32,52,'#fff');txt(level.hint,VW/2,VH*.32+46,18,'#e8ecff','center',600);cx.globalAlpha=1}
  if(toast.t>0){toast.t-=1/60;cx.globalAlpha=Math.min(1,toast.t);cx.fillStyle='rgba(10,10,30,.7)';rr(VW/2-240,VH-86,480,46,23);cx.fill();txt(toast.msg,VW/2,VH-63,18,'#bfe8ff','center',700);cx.globalAlpha=1}}

function button(label,x,y,w,h,act,i){buttons.push({x,y,w,h,act});const on=menuSel===i;cx.fillStyle=on?'#fff3b0':'rgba(255,255,255,.12)';rr(x,y,w,h,h/2);cx.fill();if(on){cx.strokeStyle='rgba(255,220,110,.6)';cx.lineWidth=3;cx.stroke()}txt(label,x+w/2,y+h/2+1,20,on?'#2a1a3a':'#fff','center',800)}
function drawTitleBg(){const th=THEMES.dusk;cam.x=titleT*40;cam.y=0;sky(th,cam.x);hills(th.far,cam.x*.2,VH*.66,60,.006,1);hills(th.mid,cam.x*.45,VH*.8,50,.01,4);hills('#2a1530',cam.x*.8,VH*.93,30,.014,9);
  for(let i=0;i<30;i++){const x=((i*97+titleT*20)%VW+VW)%VW,y=((i*53-titleT*16*(1+i%3))%VH+VH)%VH;glow(x,y,6,'rgba(255,220,140,.6)')}}
function drawTitle(){buttons=[];const bob=Math.sin(titleT*2.2)*8;drawLumi(VW/2,VH*.36+bob,1,1+Math.sin(titleT*4.4)*.05,Math.sin(titleT*.7)>-.97?1:0,3.2);
  txt("LUMI'S LEAP",VW/2,VH*.12,64,'#fff3b0');txt('a little light, a long way home',VW/2,VH*.12+46,18,'#ffe2c4','center',600);
  const cont=save.unlocked>1;let i=0;button(cont?'Continue':'Play',VW/2-130,VH*.58,260,52,()=>goFade(()=>{state='select';menuSel=Math.max(0,save.unlocked-1)}),i++);
  button(`Music: ${save.music?'on':'off'}`,VW/2-130,VH*.58+64,260,52,()=>music.set(!save.music),i++);
  button(`Sound: ${save.sfx?'on':'off'}`,VW/2-130,VH*.58+128,260,52,()=>{save.sfx=!save.sfx;store()},i++);
  txt('Move: arrows / A D   ·   Jump: Space / Z / W / Up   ·   Pause: Esc',VW/2,VH-24,14,'rgba(255,255,255,.7)','center',600)}
function drawSelect(){buttons=[];txt('Choose a world',VW/2,64,40,'#fff3b0');const cw=270,chh=130,gx=36,cols=3,ox=(VW-(cols*cw+(cols-1)*gx))/2;
  LEVELS.forEach((L,i)=>{const x=ox+(i%cols)*(cw+gx),y=120+Math.floor(i/cols)*(chh+30),open=i<save.unlocked,on=menuSel===i,th=THEMES[L.theme];buttons.push({x,y,w:cw,h:chh,act:()=>{if(open)goFade(()=>loadLevel(i));else toastMsg('Finish the world before it first')}});
    const gr=cx.createLinearGradient(x,y,x,y+chh);gr.addColorStop(0,th.sky[0]);gr.addColorStop(1,th.sky[1]);cx.fillStyle=gr;rr(x,y,cw,chh,18);cx.fill();cx.save();rr(x,y,cw,chh,18);cx.clip();cx.fillStyle=th.mid;cx.fillRect(x,y+chh-36,cw,36);cx.fillStyle=th.top;cx.fillRect(x,y+chh-36,cw,6);cx.restore();
    if(on){cx.strokeStyle='#fff3b0';cx.lineWidth=4;rr(x,y,cw,chh,18);cx.stroke()}
    if(!open){cx.fillStyle='rgba(0,0,0,.55)';rr(x,y,cw,chh,18);cx.fill();txt('🔒',x+cw/2,y+chh/2,34)}
    txt(`${i+1}. ${L.name}`,x+16,y+26,20,'#fff','left',800);
    const k=String(i),gs=save.gems[k]||[];for(let j=0;j<3;j++){const gx2=x+24+j*24,gy=y+60;cx.fillStyle=gs[j]?'#7ee8ff':'rgba(255,255,255,.25)';cx.beginPath();cx.moveTo(gx2,gy-10);cx.lineTo(gx2+8,gy);cx.lineTo(gx2,gy+12);cx.lineTo(gx2-8,gy);cx.closePath();cx.fill()}
    if(save.best[k])txt('Best '+fmtT(save.best[k]),x+cw-14,y+60,15,'#fff','right',700)});
  buttons.push({x:VW/2-90,y:VH-70,w:180,h:46,act:()=>goFade(()=>{state='title';menuSel=0})});const on=menuSel===LEVELS.length;cx.fillStyle=on?'#fff3b0':'rgba(255,255,255,.12)';rr(VW/2-90,VH-70,180,46,23);cx.fill();txt('Back',VW/2,VH-46,20,on?'#2a1a3a':'#fff');
  if(toast.t>0){toast.t-=1/60;txt(toast.msg,VW/2,VH-100,16,'#ffd0d0','center',700)}}
function drawPause(){buttons=[];cx.fillStyle='rgba(7,8,26,.7)';cx.fillRect(0,0,VW,VH);txt('Paused',VW/2,VH*.26,52,'#fff3b0');let i=0;
  button('Resume',VW/2-130,VH*.4,260,52,()=>{state='play'},i++);button('Restart world',VW/2-130,VH*.4+64,260,52,()=>goFade(()=>loadLevel(li)),i++);
  button(`Music: ${save.music?'on':'off'}`,VW/2-130,VH*.4+128,260,52,()=>music.set(!save.music),i++);button('World select',VW/2-130,VH*.4+192,260,52,()=>goFade(()=>{state='select';menuSel=li}),i++)}
function drawWin(){buttons=[];cx.fillStyle='rgba(7,8,26,.72)';cx.fillRect(0,0,VW,VH);const w=winInfo,end=state==='end';
  txt(end?'You made it home!':'World complete!',VW/2,VH*.2,48,'#fff3b0');if(end)txt('Lumi found the way. Thank you for playing.',VW/2,VH*.2+42,18,'#ffe2c4','center',600);
  txt(`Orbs  ${w.orbs} / ${w.total}`,VW/2,VH*.38,24);txt(`Gems  ${w.gems} / 3`,VW/2,VH*.38+36,24,'#7ee8ff');txt(`Time  ${fmtT(w.time)}   (best ${fmtT(w.best)})`,VW/2,VH*.38+72,20,'#fff','center',700);txt(`Tries  ${w.deaths+1}`,VW/2,VH*.38+104,18,'rgba(255,255,255,.75)','center',600);
  let i=0;if(!end)button('Next world',VW/2-130,VH*.66,260,52,()=>goFade(()=>loadLevel(li+1)),i++);button('Play again',VW/2-130,VH*.66+(end?0:64),260,52,()=>goFade(()=>loadLevel(li)),i++);button('World select',VW/2-130,VH*.66+(end?64:128),260,52,()=>goFade(()=>{state='select';menuSel=li}),i++)}

// the thumbnail Lumen shows in its game library (open with ?poster)
function drawPoster(){const th=THEMES.dusk;titleT=12;cam.x=600;cam.y=0;sky(th,cam.x);hills(th.far,cam.x*.2,VH*.6,60,.006,1);hills(th.mid,cam.x*.45,VH*.76,50,.01,4);
  for(let i=0;i<34;i++){const x=(i*97)%VW,y=(i*53)%VH;glow(x,y,7,'rgba(255,220,140,.55)')}
  const ground=(x,w,y,top)=>{cx.fillStyle='#3a2131';rr(x,y,w,VH-y+20,10);cx.fill();cx.fillStyle=top;cx.fillRect(x,y,w,10);cx.fillStyle='#d36a4f';cx.fillRect(x,y+10,w,4)};
  ground(-20,330,430,'#ff9d6c');ground(470,180,360,'#ff9d6c');ground(760,240,300,'#ff9d6c');
  cx.fillStyle='#c97c54';rr(330,300,110,12,5);cx.fill();
  const orb=(x,y)=>{glow(x,y,18,'rgba(255,220,110,.55)');cx.fillStyle='#ffe68a';cx.beginPath();cx.arc(x,y,7,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(x-2,y-2,2.2,0,7);cx.fill()};
  for(let i=0;i<5;i++){const t=i/4;orb(560+i*40,330-Math.sin(t*Math.PI)*70)}orb(820,250);orb(860,250);orb(900,250);
  const gx=560,gy=300;glow(gx,gy,36,'rgba(120,230,255,.5)');cx.fillStyle='#7ee8ff';cx.beginPath();cx.moveTo(gx,gy-16);cx.lineTo(gx+13,gy-3);cx.lineTo(gx,gy+16);cx.lineTo(gx-13,gy-3);cx.closePath();cx.fill();
  const g={x:900,y:300};for(let i=0;i<3;i++){cx.strokeStyle=`hsla(${(i*50+260)%360},90%,75%,${.8-i*.22})`;cx.lineWidth=5;cx.beginPath();cx.ellipse(g.x,g.y-44,26+i*6,40+i*6,0,0,7);cx.stroke()}glow(g.x,g.y-44,80,'rgba(200,170,255,.35)');
  for(let i=0;i<14;i++){cx.fillStyle=`rgba(255,230,140,${i/14*.35})`;cx.beginPath();cx.arc(220+i*17,470-Math.sin(i/14*1.5)*125,4+i*.6,0,7);cx.fill()}
  time=.3;drawLumi(470,372,1,.85,1,2.7);
  cx.save();cx.translate(100,140);txt("LUMI'S LEAP",0,0,96,'#fff3b0','left',900);txt('six worlds · one little light',4,66,24,'#ffe2c4','left',700);cx.restore()}
if(/[?&]poster/.test(location.search))state='poster';
/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;const STEP=1/120;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;let n=0;while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++}draw()}
requestAnimationFrame(frame);
window.__lumi={keys,pressed,step:update,loadLevel,get P(){return P},get level(){return level},get state(){return state},save,LEVELS};
</script>
