name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (GitHub's Ubuntu runners already include the Android SDK)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && gradle -p android assembleDebug -PversionCode=${{ github.run_number }}

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lumen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-apk
          path: Lumen.apk

      - name: Publish to the "Lumen for Android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Lumen.apk \
            --title "Lumen for Android (build ${{ github.run_number }})" \
            --notes "Download **Lumen.apk** below and open it on your Android phone. You may need to allow installing apps from your browser or files app. Built from ${{ github.sha }}."
