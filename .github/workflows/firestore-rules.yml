# Publishes firestore.rules to Firebase whenever they change on main (or when run by hand from the Actions tab).
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret: see SETUP.md, step 7. Without it the run just warns and stops.
name: Publish Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT secret to publish the rules automatically (SETUP.md, step 7)."
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
          npx --yes firebase-tools@14.11.0 deploy --only firestore:rules --project lumen-864cf --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
